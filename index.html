      useEffect(() => {
        if (iconRef.current) {
          iconRef.current.innerHTML = '';
          const iconNode = lucide.createIcons({
            icons: { [name]: lucide.icons[name] },
            nameAttr: 'data-lucide'
          });
        }
      }, [name, className, fill]);

      return (
        <span 
          ref={iconRef} 
          className={`inline-flex items-center justify-center ${className}`}
        >
          <i 
            data-lucide={name.toLowerCase().replace(/([a-z0-9])([A-Z])/g, '$1-$2')}

    function App() {
      const [activeTab, setActiveTab] = useState('all');
      const [searchTerm, setSearchTerm] = useState('');
      const [openFaq, setOpenFaq] = useState(null);
      const [selectedCardModal, setSelectedCardModal] = useState(null);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);

      // Sound Synth Generator via Web Audio API
      const playSound = (type) => {
        if (!soundEnabled) return;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === 'angel') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
            osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3); // A5
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
          } else if (type === 'devil') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, ctx.currentTime); // A3
            osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.4); // A2
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
          } else if (type === 'click') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, ctx.currentTime);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            osc.start();

          {/* ========================================== */}
          {/* SECTION E: SISTEM POIN                     */}
          {/* ========================================== */}
          <section id="scoring" className="py-20 px-4 sm:px-6 lg:px-8 max-w-6xl mx-auto space-y-12">
            
            <div className="text-center space-y-3">
              <h2 className="text-3xl sm:text-4xl font-bold font-serif text-slate-100">
                Sistem Poin & Perhitungan
              </h2>
              <div className="w-20 h-1 bg-amber-500 mx-auto rounded-full" />
              <p className="text-slate-400 max-w-xl mx-auto text-sm sm:text-base">
                Pahami aturan perolehan skor dasar dan interaksi nilai setiap ronde.
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              
              <div className="bg-[#0b0f19] p-6 rounded-2xl border border-slate-800 text-center space-y-3">
                <div className="text-3xl font-extrabold text-amber-400 font-serif">+1 POIN</div>
                <h4 className="font-bold text-slate-200">Menang Ronde</h4>
                <p className="text-xs text-slate-400">
                  Pemain dengan nilai kartu utama lebih tinggi memenangkan ronde dan berhak mengambil 1 Kartu Skill.
                </p>
              </div>

              <div className="bg-[#0b0f19] p-6 rounded-2xl border border-slate-800 text-center space-y-3">
                <div className="text-3xl font-extrabold text-slate-500 font-serif">+0 POIN</div>
                <h4 className="font-bold text-slate-200">Kalah Ronde</h4>
                <p className="text-xs text-slate-400">
                  Pemain yang nilai kartunya lebih rendah tidak mendapat poin dasar dan tidak berhak memilih jalur skill.
                </p>
              </div>

              <div className="bg-[#0b0f19] p-6 rounded-2xl border border-slate-800 text-center space-y-3">
                <div className="text-3xl font-extrabold text-sky-400 font-serif">SERI</div>
                <h4 className="font-bold text-slate-200">Kartu Bernilai Sama</h4>
                <p className="text-xs text-slate-400">
                  Kedua pemain tidak memperoleh poin (+0) dan tumpukan jalur skill tidak diambil pada ronde tersebut.
                </p>
              </div>

            </div>

            {/* SCORING EXAMPLE PANEL */}
            <div className="bg-gradient-to-r from-slate-900 via-[#0e1320] to-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 space-y-4 shadow-xl">
              <div className="flex items-center gap-2 text-amber-400 font-bold uppercase text-xs tracking-widest">
                <LucideIcon name="Info" className="w-4 h-4" />
                Contoh Kasus Sederhana Ronde 1
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 items-center text-center">
                <div className="bg-slate-950/80 p-4 rounded-xl border border-slate-800">
                  <span className="text-xs text-slate-400 block">Pemain A Memasang</span>
                  <span className="text-2xl font-bold text-amber-400 font-serif">Kartu Utama #8</span>
                </div>

                <div className="text-slate-500 font-serif text-xl font-bold">VS</div>

                <div className="bg-slate-950/80 p-4 rounded-xl border border-slate-800">
                  <span className="text-xs text-slate-400 block">Pemain B Memasang</span>
                  <span className="text-2xl font-bold text-slate-300 font-serif">Kartu Utama #5</span>
                </div>
              </div>

              <div className="text-center pt-2 text-sm text-slate-300">
                <strong className="text-amber-400">Hasil:</strong> Pemain A memenangkan ronde (8 &gt; 5). Pemain A memperoleh <span className="text-amber-300 font-bold">+1 Poin</span> dan berhak memilih <span className="text-sky-300 font-semibold">Jalur Malaikat</span> atau <span className="text-rose-400 font-semibold">Jalur Iblis</span>.
              </div>
            </div>

          </section>

          {/* ========================================== */}
          {/* SECTION F: DUA JALUR PILIHAN               */}
          {/* ========================================== */}
          <section id="paths" className="py-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto space-y-12">
            
            <div className="text-center space-y-3">
              <h2 className="text-3xl sm:text-4xl font-bold font-serif text-slate-100">
                Dua Jalur Pilihan
              </h2>
              <div className="w-20 h-1 bg-gradient-to-r from-sky-400 to-rose-500 mx-auto rounded-full" />
              <p className="text-slate-400 max-w-2xl mx-auto text-sm sm:text-base">
                Setiap kemenangan memberi hak memilih moralitas strategi Anda. Pemain yang kalah tidak memilih jalur.
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
              
              {/* PANEL MALAIKAT */}
              <div className="relative group bg-gradient-to-b from-[#0e1726] to-[#090e17] rounded-3xl border border-sky-500/30 hover:border-sky-400 p-8 space-y-6 transition-all duration-500 shadow-2xl hover:shadow-sky-500/20">
                <div className="absolute top-0 right-0 w-32 h-32 bg-sky-400/10 rounded-full blur-2xl pointer-events-none" />

                <div className="flex items-center gap-4">
                  <div className="p-3 rounded-2xl bg-sky-500/20 text-sky-300 border border-sky-400/30">
                    <LucideIcon name="Shield" className="w-8 h-8" />
                  </div>
                  <div>
                    <h3 className="text-2xl font-bold text-sky-100 font-serif">Jalur Malaikat</h3>
                    <p className="text-xs text-sky-400 font-semibold uppercase tracking-widest">Protektif & Stabil</p>
                  </div>
                </div>

                <p className="text-slate-300 text-sm leading-relaxed">
                  Jalur Malaikat dirancang untuk pemain yang memprioritaskan konsistensi dan pertahanan. Efek skill ini berfokus melindungi poin dari gangguan lawan, memulihkan kondisi saat terdesak, serta mengontrol kestabilan jalurnya pertandingan.
                </p>

                <div className="space-y-3 border-t border-sky-900/40 pt-4">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-sky-300">Fokus Strategi:</h4>
                  <ul className="space-y-2 text-xs text-slate-300">
                    <li className="flex items-center gap-2">
                      <div className="w-1.5 h-1.5 rounded-full bg-sky-400" />
                      Pencegahan pengurangan poin saat mengalami kekalahan
                    </li>
                    <li className="flex items-center gap-2">
                      <div className="w-1.5 h-1.5 rounded-full bg-sky-400" />
                      Membatalkan / menetralisir efek serangan kartu Iblis lawan
                    </li>
                    <li className="flex items-center gap-2">
                      <div className="w-1.5 h-1.5 rounded-full bg-sky-400" />
                      Bonus poin tambahan dari kemenangan terstruktur
                    </li>
                  </ul>
                </div>
              </div>

              {/* PANEL IBLIS */}
              <div className="relative group bg-gradient-to-b from-[#240a10] to-[#0e0407] rounded-3xl border border-rose-500/30 hover:border-rose-500 p-8 space-y-6 transition-all duration-500 shadow-2xl hover:shadow-rose-500/20">
                <div className="absolute top-0 right-0 w-32 h-32 bg-rose-600/10 rounded-full blur-2xl pointer-events-none" />

                <div className="flex items-center gap-4">
                  <div className="p-3 rounded-2xl bg-rose-500/20 text-rose-400 border border-rose-500/30">
                    <LucideIcon name="Flame" className="w-8 h-8" />
                  </div>
                  <div>
                    <h3 className="text-2xl font-bold text-rose-100 font-serif">Jalur Iblis</h3>
                    <p className="text-xs text-rose-500 font-semibold uppercase tracking-widest">Agresif & Berisiko</p>
                  </div>
                </div>

                <p className="text-slate-300 text-sm leading-relaxed">
                  Jalur Iblis ditujukan bagi pemikir taktis bernyali tinggi. Efek skill Iblis menawarkan daya rusak besar, mencuri poin musuh, serta memutarbalikkan aturan nilai, namun berpotensi membawa hukuman pengurangan poin jika salah perhitungan.
                </p>

                <div className="space-y-3 border-t border-rose-900/40 pt-4">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-rose-400">Fokus Strategi:</h4>
                  <ul className="space-y-2 text-xs text-slate-300">
                    <li className="flex items-center gap-2">
                      <div className="w-1.5 h-1.5 rounded-full bg-rose-500" />
                      Pengurangan nilai kartu utama lawan secara langsung
                    </li>
                    <li className="flex items-center gap-2">
                      <div className="w-1.5 h-1.5 rounded-full bg-rose-500" />
                      Pencurian poin dan taruhan ganda berisiko tinggi
                    </li>
                    <li className="flex items-center gap-2">
                      <div className="w-1.5 h-1.5 rounded-full bg-rose-500" />
                      Memutarbalikkan logika ronde (misal: nilai terkecil yang menang)
                    </li>
                  </ul>
                </div>
              </div>

            </div>

          </section>

          {/* ========================================== */}
          {/* SECTION G: GALERI KARTU                    */}
          {/* ========================================== */}
          <section id="cards" className="py-20 px-4 sm:px-6 lg:px-8 bg-slate-950/90 border-t border-slate-800/80">
            <div className="max-w-7xl mx-auto space-y-10">
              
              <div className="text-center space-y-3">
                <h2 className="text-3xl sm:text-4xl font-bold font-serif text-slate-100">
                  Galeri Kartu Permainan
                </h2>
                <div className="w-20 h-1 bg-amber-500 mx-auto rounded-full" />
                <p className="text-slate-400 max-w-xl mx-auto text-sm sm:text-base">
                  Jelajahi seluruh daftar kartu resmi beserta detail nilai dan deskripsi efek resminya.
                </p>
              </div>

              {/* FILTER & SEARCH CONTROLS */}
              <div className="flex flex-col md:flex-row items-center justify-between gap-4 bg-[#0b0f19] p-4 rounded-2xl border border-slate-800">
                
                {/* TABS */}
                <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">
                  {[
                    { id: 'all', label: 'Semua Kartu' },
                    { id: 'main', label: 'Kartu Utama (10)' },
                    { id: 'angel', label: 'Skill Malaikat (10)' },
                    { id: 'devil', label: 'Skill Iblis (10)' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => {
                        setActiveTab(tab.id);
                        playSound('click');
                      }}
                      className={`px-4 py-2 rounded-xl text-xs font-semibold transition-all ${
                        activeTab === tab.id
                          ? 'bg-amber-500 text-slate-950 shadow-md shadow-amber-500/20'
                          : 'bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800'
                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                {/* SEARCH BOX */}
                <div className="relative w-full md:w-72">
                  <LucideIcon name="Search" className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500" />
                  <input
                    type="text"
                    placeholder="Cari nama atau efek kartu..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500/50"
                  />
                </div>

              </div>

              {/* CARDS GRID */}
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                {filteredCards.map((card) => {
                  const isAngel = card.type === 'angel';
                  const isDevil = card.type === 'devil';
                  const isMain = card.type === 'main';

                  return (
                    <div
                      key={card.id}
                      onClick={() => {
                        setSelectedCardModal(card);
                        playSound('click');
                      }}
                      className={`group relative bg-[#0b0f19] rounded-2xl border transition-all duration-300 hover:-translate-y-1.5 cursor-pointer overflow-hidden shadow-lg flex flex-col justify-between ${
                        isAngel 
                          ? 'border-sky-900/50 hover:border-sky-400/80 hover:shadow-sky-500/10' 
                          : isDevil 
                          ? 'border-rose-900/50 hover:border-rose-500/80 hover:shadow-rose-500/10' 
                          : 'border-slate-800 hover:border-amber-500/60 hover:shadow-amber-500/10'
                      }`}
                    >
                      {/* CARD HEADER / BADGE */}
                      <div className="p-5 space-y-3">
                        <div className="flex items-center justify-between">
                          <span className={`text-[10px] uppercase font-extrabold tracking-widest px-2.5 py-1 rounded-full border ${
                            isAngel 
                              ? 'bg-sky-500/10 border-sky-400/30 text-sky-300' 
                              : isDevil 
                              ? 'bg-rose-500/10 border-rose-500/30 text-rose-400' 
                              : 'bg-amber-500/10 border-amber-500/30 text-amber-400'
                          }`}>
                            {isMain ? 'Kartu Utama' : isAngel ? 'Skill Malaikat' : 'Skill Iblis'}
                          </span>

                          {card.value && (
                            <span className="w-8 h-8 rounded-lg bg-amber-500/20 border border-amber-400/40 text-amber-300 font-extrabold flex items-center justify-center text-sm font-serif">
                              {card.value}
                            </span>
                          )}
                        </div>

                        <h3 className="text-base font-bold text-slate-100 font-serif group-hover:text-amber-300 transition-colors">
                          {card.name}
                        </h3>

                        <p className="text-xs text-slate-300 line-clamp-3 leading-relaxed">
                          {card.description}
                        </p>
                      </div>

                      {/* CARD FOOTER FLAVOR */}
                      <div className="px-5 py-3 bg-slate-950/60 border-t border-slate-900 text-[11px] text-slate-400 italic">
                        "{card.flavor}"
                      </div>
                    </div>
                  );
                })}
              </div>

              {filteredCards.length === 0 && (
                <div className="text-center py-12 text-slate-500 text-sm">
                  Tidak ada kartu yang cocok dengan pencarian Anda.
                </div>
              )}

            </div>
          </section>

          {/* ========================================== */}
          {/* SECTION H: SIMULASI PANDUAN RONDE          */}
          {/* ========================================== */}
          <section id="simulator" className="py-20 px-4 sm:px-6 lg:px-8 max-w-5xl mx-auto space-y-12">
            
            <div className="text-center space-y-3">
              <h2 className="text-3xl sm:text-4xl font-bold font-serif text-slate-100">
                Simulasi Visual 1 Ronde
              </h2>
              <div className="w-20 h-1 bg-amber-500 mx-auto rounded-full" />
              <p className="text-slate-400 max-w-xl mx-auto text-sm sm:text-base">
                Uji pemahaman visual tentang alur berjalannya satu ronde pertempuran.
              </p>
            </div>

            <RoundSimulatorWidget playSound={playSound} />

          </section>

          {/* ========================================== */}
          {/* SECTION I: FAQ                             */}
          {/* ========================================== */}
          <section id="faq" className="py-20 px-4 sm:px-6 lg:px-8 bg-slate-950/80 border-t border-slate-800/80">
            <div className="max-w-4xl mx-auto space-y-10">
              
              <div className="text-center space-y-3">
                <h2 className="text-3xl sm:text-4xl font-bold font-serif text-slate-100">
                  Pertanyaan Umum (FAQ)
                </h2>
                <div className="w-20 h-1 bg-amber-500 mx-auto rounded-full" />
                <p className="text-slate-400 max-w-xl mx-auto text-sm sm:text-base">
                  Jawaban resmi atas pertanyaan yang sering diajukan oleh pemain baru.
                </p>
              </div>

              <div className="space-y-4">
                {FAQ_DATA.map((faq, idx) => (
                  <div 
                    key={idx}
                    className="bg-[#0b0f19] border border-slate-800 rounded-2xl overflow-hidden transition-all"
                  >
                    <button
                      onClick={() => {
                        setOpenFaq(openFaq === idx ? null : idx);
                        playSound('click');
                      }}
                      className="w-full text-left p-5 sm:p-6 flex items-center justify-between gap-4 hover:bg-slate-900/50 transition-colors"
                    >
                      <span className="font-bold text-slate-200 text-sm sm:text-base font-serif flex items-center gap-3">
                        <LucideIcon name="HelpCircle" className="w-5 h-5 text-amber-500 flex-shrink-0" />
                        {faq.q}
                      </span>
                      <LucideIcon name="ChevronDown" className={`w-5 h-5 text-slate-400 transition-transform duration-300 ${openFaq === idx ? 'rotate-180 text-amber-400' : ''}`} />
                    </button>

                    {openFaq === idx && (
                      <div className="px-6 pb-6 pt-2 text-slate-300 text-sm leading-relaxed border-t border-slate-800/60 bg-slate-950/40">
                        {faq.a}
                      </div>
                    )}
                  </div>
                ))}
              </div>

            </div>
          </section>

          {/* ========================================== */}
          {/* CARD DETAIL MODAL                          */}
          {/* ========================================== */}
          {selectedCardModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn">
              <div className="relative bg-[#0c101b] border border-slate-800 rounded-3xl max-w-md w-full p-6 sm:p-8 space-y-6 shadow-2xl">
                
                <button
                  onClick={() => setSelectedCardModal(null)}
                  className="absolute top-4 right-4 p-2 rounded-full bg-slate-900 border border-slate-800 text-slate-400 hover:text-white"
                >
                  <LucideIcon name="X" className="w-5 h-5" />
                </button>

                <div className="space-y-3">
                  <span className={`text-[10px] uppercase font-extrabold tracking-widest px-3 py-1 rounded-full border ${
                    selectedCardModal.type === 'angel' 
                      ? 'bg-sky-500/10 border-sky-400/30 text-sky-300' 
                      : selectedCardModal.type === 'devil' 
                      ? 'bg-rose-500/10 border-rose-500/30 text-rose-400' 
                      : 'bg-amber-500/10 border-amber-500/30 text-amber-400'
                  }`}>
                    {selectedCardModal.type === 'main' ? 'Kartu Utama' : selectedCardModal.type === 'angel' ? 'Skill Malaikat' : 'Skill Iblis'}
                  </span>

                  <h3 className="text-2xl font-bold text-slate-100 font-serif">
                    {selectedCardModal.name}
                  </h3>
                </div>

                {selectedCardModal.value && (
                  <div className="p-4 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-between">
                    <span className="text-xs text-amber-300 font-semibold">Nilai Kartu Utama</span>
                    <span className="text-3xl font-extrabold text-amber-400 font-serif">{selectedCardModal.value}</span>
                  </div>
                )}

                <div className="space-y-2">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400">Deskripsi Efek Resmi</h4>
                  <p className="text-sm text-slate-200 leading-relaxed bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                    {selectedCardModal.description}
                  </p>
                </div>

                <div className="text-xs italic text-slate-400 text-center pt-2">
                  "{selectedCardModal.flavor}"
                </div>

                <button
                  onClick={() => setSelectedCardModal(null)}
                  className="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs uppercase tracking-wider transition-colors"
                >
                  Tutup Preview
                </button>

              </div>
            </div>
          )}

          {/* ========================================== */}
          {/* SECTION J: FOOTER                          */}
          {/* ========================================== */}
          <footer className="bg-[#04060a] border-t border-slate-800/80 py-12 px-4 sm:px-6 lg:px-8 text-slate-400 text-sm">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-8">
              
              <div className="space-y-2 text-center md:text-left">
                <div className="flex items-center justify-center md:justify-start gap-2">
                  <LucideIcon name="Swords" className="w-5 h-5 text-amber-400" />
                  <span className="text-lg font-bold text-slate-100 font-serif uppercase tracking-wider">
                    Malaikat <span className="text-amber-500">atau</span> Iblis
                  </span>
                </div>
                <p className="text-xs text-slate-400 max-w-sm">
                  Sebuah card game strategi tentang pilihan, keberanian, dan konsekuensi.
                </p>
              </div>

              <div className="flex flex-wrap items-center justify-center gap-6 text-xs font-medium text-slate-300">
                <button onClick={() => scrollToSection('about')} className="hover:text-amber-400">Tentang</button>
                <button onClick={() => scrollToSection('components')} className="hover:text-amber-400">Komponen</button>
                <button onClick={() => scrollToSection('how-to-play')} className="hover:text-amber-400">Cara Bermain</button>
                <button onClick={() => scrollToSection('cards')} className="hover:text-amber-400">Galeri Kartu</button>
                <button onClick={() => scrollToSection('faq')} className="hover:text-amber-400">FAQ</button>
              </div>

              <div className="text-xs text-slate-400 text-center md:text-right">
                &copy; {new Date().getFullYear()} Malaikat atau Iblis. All rights reserved.<br />
                Panduan Resmi Card Game Digital Rulebook.
              </div>

            </div>
          </footer>

        </div>
      );
    }

    // Render App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
